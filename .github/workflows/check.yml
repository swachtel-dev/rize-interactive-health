# The whole automated check. This file is the entire "system" Greg asked us not
# to build: no server, no database, no dashboard app. GitHub runs it for free.
#
# Diagnosing a failure: read TRIAGE.md. Every run writes a summary that names it.
name: Check interactive pages

on:
  push:
    branches: [main]
  schedule:
    # Every Monday 07:00 Eastern, year round.
    - cron: '0 11 * * 1'
    # Daily through the run-up to each term (December/January for spring,
    # July/August for fall), so a break is caught weeks before students arrive.
    - cron: '0 11 * 12,1,7,8 *'
  workflow_dispatch:

permissions:
  contents: write

# Two runs publishing the status board at once race on the push and one loses,
# which used to fail a run in which every page was healthy (2026-09-21). Queue
# them instead of cancelling, so a scheduled run is never silently dropped.
concurrency:
  group: interactive-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Check every page
        id: check
        run: node scripts/check.mjs --manifest manifest.json --out results.json
        continue-on-error: true

      - name: Build the status page
        env:
          HELPDESK_URL: ${{ vars.HELPDESK_URL }}
        run: node scripts/render_status.mjs --in results.json --out docs/index.html

      - name: Publish the status page
        id: publish
        run: |
          git config user.name  "interactive-health bot"
          git config user.email "actions@github.com"
          git add docs/index.html results.json
          if git diff --staged --quiet; then
            echo "Status board unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "status: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this run was checking 52 pages. Rebase
          # onto them and retry rather than failing a run whose pages were fine.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt of 3)."
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error::Could not publish the status board after 3 attempts."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.json

      # The run summary. Written on every run, pass or fail, and the first thing
      # anyone (or any Claude) sees from the failure email's link. It names the
      # failure CLASS, because "a page is broken" and "the run itself broke" need
      # completely different responses, and it points at the docs so nobody has
      # to rediscover how this works.
      - name: Write the run summary
        if: always()
        run: |
          {
            if [ "${{ steps.check.outcome }}" = "failure" ]; then
              echo "## 🔴 CONTENT FAILURE: a page students use is broken"
              echo ""
              echo "One or more pages a live course links to did not work. This is real; fix the page."
              echo ""
              node -e '
                const r = require("./results.json");
                for (const b of r.results.filter(x => x.status === "FAIL")) {
                  console.log("- **" + (b.title || b.id) + "** (" + (b.courses.join(", ") || "no course") + ")");
                  console.log("  - " + b.url);
                  for (const f of b.fails) console.log("  - " + f);
                }
              ' || echo "_(results.json unreadable; see the Check every page step)_"
            elif [ "${{ job.status }}" = "failure" ]; then
              echo "## 🟠 INFRASTRUCTURE FAILURE: the pages are fine, the run is not"
              echo ""
              echo "Every checked page passed. A step of the workflow itself failed, so this is"
              echo "**not** a student-facing problem. Most common cause: two runs publishing the"
              echo "status board at once and racing on the push."
            else
              echo "## 🟢 All checked pages are healthy"
            fi
            echo ""
            if [ -f results.json ]; then
              node -e '
                const s = require("./results.json").summary;
                console.log("`" + s.ok + " OK · " + s.warn + " with notes · " + s.fail + " broken · " +
                            s.total + " pages · " + s.deadLinks + " dead outbound links`");
              ' || true
            fi
            echo ""
            echo "### Where to look (read these, do not rediscover them)"
            echo ""
            echo "| Question | Read |"
            echo "|---|---|"
            echo "| How do I triage this exact failure? | [\`TRIAGE.md\`](https://github.com/${{ github.repository }}/blob/main/TRIAGE.md) — start here |"
            echo "| What does the checker actually check? | [\`README.md\`](https://github.com/${{ github.repository }}/blob/main/README.md) |"
            echo "| How do I set this up for another ID? | [\`FOR-CLAUDES.md\`](https://github.com/${{ github.repository }}/blob/main/FOR-CLAUDES.md) |"
            echo "| What must a page do to pass? | [\`SELFCHECK.md\`](https://github.com/${{ github.repository }}/blob/main/SELFCHECK.md) |"
            echo "| When is an interactive page allowed at all? | \`standards/interactive-pages.md\` in the Workbench repo (\`projects/hacking/repos/coursedev/\`) |"
            echo ""
            echo "Status board: https://swachtel-dev.github.io/rize-interactive-health/"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional. Add a SLACK_WEBHOOK secret to get pinged; without it this is skipped.
      - name: Tell Slack a page is broken
        if: steps.check.outcome == 'failure' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$HOOK" -d "$(node -e '
            const r = require("./results.json");
            const broken = r.results.filter(x => x.status === "FAIL");
            console.log(JSON.stringify({ text:
              ":rotating_light: *" + broken.length + " Rize interactive page(s) are broken*\n" +
              broken.map(b => "• <" + b.url + "|" + (b.title || b.id) + "> (" +
                              (b.courses.join(", ") || "no course") + ") — " + b.fails[0]).join("\n") +
              "\nTriage: <https://github.com/" + process.env.REPO + "/blob/main/TRIAGE.md|TRIAGE.md>" +
              " · <https://swachtel-dev.github.io/rize-interactive-health/|status board>" });
          ')"

      # Fail the run last, so the status page and summary are always produced first.
      - name: Fail the run if any page is broken
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::A page a live course links to is broken. See the run summary and TRIAGE.md."
          exit 1
